[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visual-graph"
version = "0.1.0"
description = "Graph-based visual search and scene exploration using computer vision and Neo4j."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.scripts]
visual-graph = "visual_graph.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visual_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not inference'"
markers = [
    "integration: requires a running Neo4j instance",
    "inference: runs the real detector (slow, needs local weights)",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
strict = true